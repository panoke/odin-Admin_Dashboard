<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    
    <title>TOP - Admin Dashboard</title>
</head>
<body>
    <header>header</header>
    <aside>
        <div class="logoband">
            <h2>
                <svg>
                    <use class="icons" href="images/ui/tablet-dashboard.svg">
                </svg>
                Dashboard
            </h2>
        </div>
        <div class="main-links sidebar-links">
            <ul>
                <li>
                    <a href="home">
                        <svg>
                            <use class="icons" href="images/ui/home-circle-outline.svg">
                        </svg>
                        Home
                    </a>
                </li>
                <li>
                    <a href="profile">
                        <svg>
                            <use class="icons" href="images/ui/account-details-outline.svg">
                        </svg>
                        Profile
                    </a>
                </li>
                <li>
                    <a href="messages">
                        <svg>
                            <use class="icons" href="images/ui/message-text-outline.svg">
                        </svg>                        
                        Messages
                    </a>
                </li>
                <li>
                    <a href="history">
                        <svg>
                            <use class="icons" href="images/ui/history.svg">
                        </svg>                           
                        History
                    </a>
                </li>
                <li>
                    <a href="tasks">
                        <svg>
                            <use class="icons" href="images/ui/checkbox-marked-circle-plus-outline.svg">
                        </svg>                            
                        Tasks
                    </a>
                </li>
                <li>
                    <a href="communities">
                        <svg>
                            <use class="icons" href="images/ui/account-group-outline.svg">
                        </svg>                            
                        Communities
                    </a>
                </li>
            </ul>
        </div>
        <div class="support-links sidebar-links">
            <ul>
                <li>
                    <a href="settings">
                        <svg>
                            <use class="icons" href="images/ui/cogs.svg">
                        </svg>                             
                        Settings
                    </a>
                </li>
                <li>
                    <a href="support">
                        <svg>
                            <use class="icons" href="images/ui/lifebuoy.svg">
                        </svg>     
                        Support
                    </a>
                </li>
                <li>
                    <a href="privacy">
                        <svg>
                            <use class="icons" href="images/ui/security.svg">
                        </svg>                             
                        Privacy
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    
    <main>main</main>
</body>
</html>
